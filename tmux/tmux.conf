# System clock is UTC, so compute UTC-3 explicitly via TZ (Buenos Aires has no DST,
# fixed -03:00 offset) instead of relying on tmux's own %H:%M which follows the host TZ.
set -g status-interval 1
set -g status-right '#T-#W #(TZ="America/Argentina/Buenos_Aires" date "+%%d-%%b-%%y | %%H:%%M:%%S"  )'
set -g status-right-length 256

set -g monitor-bell on
set -g monitor-activity on
set -g visual-bell off
set -g visual-activity off

set -g window-status-bell-style fg=black,bg=red,blink
set -g window-status-activity-style fg=black,bg=yellow,blink
set -g window-status-current-style fg=black,bg=colour243

# New window with a fixed layout: one big pane on the left, two stacked
# panes on the right (all 50/50). Prompts for a working directory first
# (bash readline, Tab-completes paths) and uses it for all three panes.
# Explicitly restores plain `c` to tmux's built-in new-window (unbind-key
# would leave it doing nothing; source-file never resets bindings on its own).
bind-key C display-popup -E -w 60 -h 3 -T "New window" -d "#{pane_current_path}" \
  "~/.dotfiles/tmux/scripts/new-window-layout.sh"

# Windows and panes numbered from 1, not 0. Renumber automatically on close
# so there are no gaps in the sequence.
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Thicker pane borders (heavy box-drawing chars instead of thin single lines).
set -g pane-border-lines heavy
